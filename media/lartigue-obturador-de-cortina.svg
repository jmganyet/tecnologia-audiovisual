<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, 'SF Pro Text', system-ui, Helvetica, Arial, sans-serif"><title>Com es va fer la foto de Lartigue: la cortina de l'obturador destapa la foto franja a franja, de baix a dalt mentre la càmera gira seguint el cotxe; cada franja es grava en un instant diferent, i la roda surt inclinada endavant i el públic enrere</title><rect width="960" height="400" fill="#fff"/><rect x="2" y="2" width="306" height="396" rx="14" fill="#fff" stroke="#d9d9d9" stroke-width="2"/><text x="155" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#231F20">1. La cortina puja</text><rect x="327" y="2" width="306" height="396" rx="14" fill="#fff" stroke="#d9d9d9" stroke-width="2"/><text x="480" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#231F20">2. La càmera gira</text><rect x="652" y="2" width="306" height="396" rx="14" fill="#fff" stroke="#d9d9d9" stroke-width="2"/><text x="805" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#231F20">3. El resultat</text><rect x="55" y="70" width="200" height="240" fill="#f2f2f2" stroke="#231F20" stroke-width="2"/><rect x="55" y="70" width="200" height="98" fill="#231F20"/><rect x="55" y="168" width="200" height="22" fill="#fff" stroke="#C8102E" stroke-width="2"/><rect x="55" y="190" width="200" height="120" fill="#e6e6e6"/><rect x="55" y="70" width="200" height="240" fill="none" stroke="#231F20" stroke-width="2"/><text x="155.0" y="184" text-anchor="middle" font-size="13" fill="#C8102E" font-weight="600">la llum entra per la ranura</text><text x="155.0" y="255" text-anchor="middle" font-size="14" fill="#6d6e71">ja gravat</text><text x="155.0" y="124" text-anchor="middle" font-size="14" fill="#fff">encara tapat</text><line x1="277" y1="95" x2="277" y2="290" stroke="#C8102E" stroke-width="4"/><path d="M268,100 L277,80 L286,100 Z" fill="#C8102E"/><text x="155" y="345" text-anchor="middle" fon