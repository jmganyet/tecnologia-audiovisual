<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, 'SF Pro Text', system-ui, Helvetica, Arial, sans-serif"><title>Daguerreotip contra calotip: el daguerreotip és una placa única que no es pot copiar; el negatiu de Talbot, en canvi, dona tantes còpies positives com en vulguis</title><rect width="960" height="400" fill="#fff"/>
<text x="120" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#231F20">Daguerre, 1839</text>
<g transform="translate(40,60)"><rect width="160" height="200" rx="6" fill="#b8b8b8"/><g transform="translate(20,25)"><g transform="translate(0,0) scale(1)"><rect width="120" height="150" fill="#cfcfcf"/><rect x="52" y="85" width="16" height="50" fill="#3a3a3a"/><circle cx="60" cy="65" r="38" fill="#3a3a3a"/></g></g></g>
<text x="120" y="300" text-anchor="middle" font-size="19" fill="#231F20">Una placa de plata</text>
<text x="120" y="326" text-anchor="middle" font-size="19" font-weight="600" fill="#C8102E">única, no es pot copiar</text>
<line x1="250" y1="40" x2="250" y2="350" stroke="#d9d9d9" stroke-width="2"/>
<text x="400" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#231F20">Talbot, 1841</text>
<g transform="translate(330,80)"><g transform="translate(0,0) scale(1.1)"><rect width="120" height="150" fill="#231F20"/><rect x="52" y="85" width="16" height="50" fill="#f4efe6"/><circle cx="60" cy="65" r="38" fill="#f4efe6"/></g></g>
<text x="396" y="300" text-anchor="middle" font-size="19" fill="#231F20">Un negatiu de paper</text>
<path d="M470,160 L540,160" stroke="#231F20" stroke-width="3" marker-end="url(#f)"/>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#231F20"/></marker></defs>
<g transform="translate(560,60) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g><g transform="translate(655,60) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g><g transform="translate(750,60) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g><g transform="translate(845,60) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g><g transform="translate(560,190) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g><g transform="translate(655,190) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g><g transform="translate(750,190) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g><g transform="translate(845,190) scale(0.7)"><rect width="120" height="150" fill="#f4efe6"/><rect x="52" y="85" width="16" height="50" fill="#231F20"/><circle cx="60" cy="65" r="38" fill="#231F20"/></g>
<text x="740" y="355" text-anchor="middle" font-size="19" font-weight="600" fill="#C8102E">tantes còpies com en vulguis</text>
