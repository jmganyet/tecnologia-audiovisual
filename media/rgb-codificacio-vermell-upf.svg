<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, 'SF Pro Text', system-ui, Helvetica, Arial, sans-serif"><title>Com es codifica un color: el vermell UPF és 200 de vermell, 16 de verd i 46 de blau; en binari, vint-i-quatre uns i zeros; en hexadecimal, C8102E</title><rect width="960" height="400" fill="#fff"/>
<text x="80" y="55" font-size="17" fill="#6d6e71">quant de cada llum (0–255)</text><text x="355" y="55" font-size="17" fill="#6d6e71">nombre</text><text x="430" y="55" font-size="17" fill="#6d6e71">8 bits</text><text x="600" y="55" font-size="17" fill="#6d6e71">hex</text>
<text x="40" y="110" font-size="30" font-weight="600" fill="#e53935">R</text><rect x="80" y="80" width="255" height="44" fill="#f2f2f2"/><rect x="80" y="80" width="200" height="44" fill="#e53935"/><text x="355" y="111" font-size="26" fill="#231F20">200</text><text x="430" y="111" font-size="24" fill="#6d6e71" font-family="Menlo, monospace">11001000</text><text x="600" y="111" font-size="26" fill="#231F20" font-family="Menlo, monospace">C8</text><text x="40" y="190" font-size="30" font-weight="600" fill="#43a047">G</text><rect x="80" y="160" width="255" height="44" fill="#f2f2f2"/><rect x="80" y="160" width="16" height="44" fill="#43a047"/><text x="355" y="191" font-size="26" fill="#231F20">16</text><text x="430" y="191" font-size="24" fill="#6d6e71" font-family="Menlo, monospace">00010000</text><text x="600" y="191" font-size="26" fill="#231F20" font-family="Menlo, monospace">10</text><text x="40" y="270" font-size="30" font-weight="600" fill="#1e88e5">B</text><rect x="80" y="240" width="255" height="44" fill="#f2f2f2"/><rect x="80" y="240" width="46" height="44" fill="#1e88e5"/><text x="355" y="271" font-size="26" fill="#231F20">46</text><text x="430" y="271" font-size="24" fill="#6d6e71" font-family="Menlo, monospace">00101110</text><text x="600" y="271" font-size="26" fill="#231F20" font-family="Menlo, monospace">2E</text>
<rect x="700" y="80" width="200" height="204" fill="#C8102E"/>
<text x="800" y="320" text-anchor="middle" font-size="30" font-weight="600" fill="#231F20" font-family="Menlo, monospace">#C8102E</text>
<text x="480" y="375" text-anchor="middle" font-size="19" fill="#231F20">256 × 256 × 256 = <tspan font-weight="600" fill="#C8102E">16.777.216 colors</tspan>, amb 24 uns i zeros per píxel</text>
</svg>