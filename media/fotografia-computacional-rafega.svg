<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, 'SF Pro Text', system-ui, Helvetica, Arial, sans-serif"><title>La fotografia computacional: quan premeu el botó, el mòbil ja ha fet una ràfega de preses amb exposicions diferents i un programa les fon en una sola imatge que cap d'elles no era</title><rect width="960" height="400" fill="#fff"/>
<text x="190" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#231F20">Una ràfega de preses</text>
<g transform="translate(40,70)"><rect width="220" height="150" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><circle cx="160" cy="45" r="20" fill="#fff" opacity="0.25"/><rect x="0" y="105" width="220" height="45" fill="#4C9A2A" opacity="0.20"/></g><g transform="translate(58,88)"><rect width="220" height="150" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><circle cx="160" cy="45" r="20" fill="#fff" opacity="0.45"/><rect x="0" y="105" width="220" height="45" fill="#4C9A2A" opacity="0.36"/></g><g transform="translate(76,106)"><rect width="220" height="150" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><circle cx="160" cy="45" r="20" fill="#fff" opacity="0.7"/><rect x="0" y="105" width="220" height="45" fill="#4C9A2A" opacity="0.56"/></g><g transform="translate(94,124)"><rect width="220" height="150" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><circle cx="160" cy="45" r="20" fill="#fff" opacity="0.95"/><rect x="0" y="105" width="220" height="45" fill="#4C9A2A" opacity="0.76"/></g><g transform="translate(112,142)"><rect width="220" height="150" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><circle cx="160" cy="45" r="20" fill="#fff" opacity="1.0"/><rect x="0" y="105" width="220" height="45" fill="#4C9A2A" opacity="0.80"/></g><g transform="translate(130,160)"><rect width="220" height="150" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><circle cx="160" cy="45" r="20" fill="#fff" opacity="0.6"/><rect x="0" y="105" width="220" height="45" fill="#4C9A2A" opacity="0.48"/></g>
<text x="190" y="370" text-anchor="middle" font-size="17" fill="#6d6e71">fosques, clares, abans i després de prémer</text>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#231F20"/></marker></defs>
<path d="M400,200 L470,200" stroke="#231F20" stroke-width="3" marker-end="url(#f)"/>
<rect x="485" y="150" width="150" height="100" rx="10" fill="#C8102E"/>
<text x="560" y="195" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">programa</text><text x="560" y="222" text-anchor="middle" font-size="16" fill="#fff">alinea, tria, fon</text>
<path d="M650,200 L720,200" stroke="#231F20" stroke-width="3" marker-end="url(#f)"/>
<g transform="translate(705,125)"><rect width="200" height="150" fill="#5b8fd6"/><circle cx="145" cy="45" r="20" fill="#fff6c8"/><rect x="0" y="105" width="200" height="45" fill="#4C9A2A"/></g>
<text x="805" y="310" text-anchor="middle" font-size="19" fill="#231F20">La foto que veieu</text>
<text x="805" y="336" text-anchor="middle" font-size="19" font-weight="600" fill="#C8102E">no l'ha feta cap de les preses</text>
</svg>