<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="500" height="420" fill="#ffffff"/>
  <!-- zona de profunditat de camp -->
  <rect x="235" y="60" width="150" height="250" fill="#f6d9df"/>
  <line x1="290" y1="50" x2="290" y2="320" stroke="#c8102e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="290" y="40" text-anchor="middle" font-size="15" fill="#c8102e">pla d'enfocament</text>
  <!-- eix -->
  <line x1="60" y1="270" x2="480" y2="270" stroke="#6d6e71" stroke-width="1.5"/>
  <!-- càmera -->
  <rect x="18" y="242" width="44" height="56" rx="5" fill="#231F20"/>
  <rect x="62" y="254" width="16" height="32" fill="#231F20"/>
  <!-- objectes: borrós davant, nítids dins, borrós darrere -->
  <g opacity="0.35"><circle cx="160" cy="205" r="20" fill="#231F20"/><rect x="150" y="225" width="20" height="45" fill="#231F20"/></g>
  <g><circle cx="255" cy="205" r="20" fill="#231F20"/><rect x="245" y="225" width="20" height="45" fill="#231F20"/></g>
  <g><circle cx="290" cy="205" r="20" fill="#231F20"/><rect x="280" y="225" width="20" height="45" fill="#231F20"/></g>
  <g><circle cx="360" cy="205" r="20" fill="#231F20"/><rect x="350" y="225" width="20" height="45" fill="#231F20"/></g>
  <g opacity="0.35"><circle cx="440" cy="205" r="20" fill="#231F20"/><rect x="430" y="225" width="20" height="45" fill="#231F20"/></g>
  <!-- cota -->
  <line x1="235" y1="340" x2="385" y2="340" stroke="#231F20" stroke-width="1.5"/>
  <path d="M235,340 l10,-6 v12 z M385,340 l-10,-6 v12 z" fill="#231F20"/>
  <text x="310" y="365" text-anchor="middle" font-size="17" font-weight="bold" fill="#231F20">profunditat de camp</text>
  <text x="310" y="388" text-anchor="middle" font-size="14" fill="#231F20">prou nítid</text>
  <text x="160" y="300" text-anchor="middle" font-size="14" fill="#6d6e71">borrós</text>
  <text x="440" y="300" text-anchor="middle" font-size="14" fill="#6d6e71">borrós</text>
</svg>
