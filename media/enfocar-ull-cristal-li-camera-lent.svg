<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, 'SF Pro Text', system-ui, Helvetica, Arial, sans-serif"><title>Com enfoquen l'ull i la càmera: l'ull canvia la forma del cristal·lí, prim per mirar lluny i gruixut per mirar a prop; la càmera no canvia la lent, sinó que l'allunya o l'acosta al sensor</title><rect width="960" height="400" fill="#fff"/>
<text x="230" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#231F20">L'ull <tspan fill="#C8102E">canvia la lent de forma</tspan></text>
<line x1="0" y1="113" x2="150" y2="113" stroke="#f39c12" stroke-width="2"/><line x1="0" y1="157" x2="150" y2="157" stroke="#f39c12" stroke-width="2"/><circle cx="212" cy="135" r="70" fill="none" stroke="#231F20" stroke-width="3"/>
<ellipse cx="150" cy="135" rx="8" ry="30" fill="#cfe3f7" stroke="#231F20" stroke-width="2.5"/>
<line x1="150" y1="113" x2="282" y2="135" stroke="#f39c12" stroke-width="2"/><line x1="150" y1="157" x2="282" y2="135" stroke="#f39c12" stroke-width="2"/>
<circle cx="282" cy="135" r="4" fill="#231F20"/>
<text x="307" y="131" font-size="19" font-weight="600" fill="#231F20">Lluny</text><text x="307" y="155" font-size="16" fill="#6d6e71">cristal·lí prim</text>
<circle cx="60" cy="300" r="6" fill="#C8102E"/><line x1="60" y1="300" x2="150" y2="278" stroke="#f39c12" stroke-width="2"/><line x1="60" y1="300" x2="150" y2="322" stroke="#f39c12" stroke-width="2"/><circle cx="212" cy="300" r="70" fill="none" stroke="#231F20" stroke-width="3"/>
<ellipse cx="150" cy="300" rx="18" ry="30" fill="#cfe3f7" stroke="#231F20" stroke-width="2.5"/>
<line x1="150" y1="278" x2="282" y2="300" stroke="#f39c12" stroke-width="2"/><line x1="150" y1="322" x2="282" y2="300" stroke="#f39c12" stroke-width="2"/>
<circle cx="282" cy="300" r="4" fill="#231F20"/>
<text x="307" y="296" font-size="19" font-weight="600" fill="#231F20">A prop</text><text x="307" y="320" font-size="16" fill="#6d6e71">cristal·lí gruixut</text>
<line x1="470" y1="60" x2="470" y2="380" stroke="#d9d9d9" stroke-width="2"/>
<text x="720" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#231F20">La càmera <tspan fill="#C8102E">mou la lent</tspan></text>
<line x1="500" y1="113" x2="630" y2="113" stroke="#f39c12" stroke-width="2"/><line x1="500" y1="157" x2="630" y2="157" stroke="#f39c12" stroke-width="2"/><rect x="570" y="85" width="190" height="100" fill="none" stroke="#231F20" stroke-width="3"/>
<rect x="746" y="97" width="7" height="76" fill="#43a047"/>
<ellipse cx="630" cy="135" rx="8" ry="32" fill="#cfe3f7" stroke="#231F20" stroke-width="2.5"/>
<line x1="630" y1="113" x2="746" y2="135" stroke="#f39c12" stroke-width="2"/><line x1="630" y1="157" x2="746" y2="135" stroke="#f39c12" stroke-width="2"/>
<text x="780" y="131" font-size="19" font-weight="600" fill="#231F20">Lluny</text><text x="780" y="155" font-size="16" fill="#6d6e71">lent a prop del sensor</text>
<circle cx="510" cy="300" r="6" fill="#C8102E"/><line x1="510" y1="300" x2="595" y2="278" stroke="#f39c12" stroke-width="2"/><line x1="510" y1="300" x2="595" y2="322" stroke="#f39c12" stroke-width="2"/><rect x="570" y="250" width="190" height="100" fill="none" stroke="#231F20" stroke-width="3"/>
<rect x="746" y="262" width="7" height="76" fill="#43a047"/>
<ellipse cx="595" cy="300" rx="8" ry="32" fill="#cfe3f7" stroke="#231F20" stroke-width="2.5"/>
<line x1="595" y1="278" x2="746" y2="300" stroke="#f39c12" stroke-width="2"/><line x1="595" y1="322" x2="746" y2="300" stroke="#f39c12" stroke-width="2"/>
<text x="780" y="296" font-size="19" font-weight="600" fill="#231F20">A prop</text><text x="780" y="320" font-size="16" fill="#6d6e71">lent més lluny</text>
</svg>